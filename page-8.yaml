- 原文: Νῦν γὰρ βλέπομεν δι’ ἐσόπτρου ἐν αἰνίγματι, τότε δὲ πρόσωπον πρὸς πρόσωπον· νῦν γινώσκω ἐκ μέρους, τότε δὲ ἐπιγνώσομαι καθὼς καὶ ἐπεγνώσθην.
  译文: 我们如今仿佛对着镜子观看，模糊不清，到那时就要面对面了。我如今所知道的有限，到那时就全知道，如同主知道我一样。
  底部注释: 《圣经·新约·哥林多前书》
  位置: 1

- 原文: If you can't tell, does it matter?
  译文: 如果不能分辨，那有区别吗？
  底部注释: 《西部世界》第一季
  位置: 2
